[global]
pid = /run/digit-hosting-admin/php-fpm.pid
error_log = /var/log/digit-hosting-admin/php-fpm.log
daemonize = no

[hostingadmin]

user = hostingadmin
group = hostingadmin

listen = /run/digit-hosting-admin/php83-fpm.sock

listen.owner = www
listen.group = www
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 10s
pm.max_requests = 500

request_terminate_timeout = 60s
catch_workers_output = yes

php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on

php_admin_value[error_log] = /www/wwwroot/hosting-admin.digit.crru.ac.th/storage/logs/php-error.log

php_admin_value[open_basedir] = /www/wwwroot/hosting-admin.digit.crru.ac.th:/var/lib/digit-hosting-admin/status:/etc/digit-hosting-admin:/tmp
